server {
    listen 80;
    server_name localhost;

    # 1. La raíz principal es la carpeta public
    root /var/www/html/public;
    index index.php index.html;

    # 2. Configuración especial para la carpeta FRONTEND
    location /frontend/ {
        alias /var/www/html/frontend/;

        # Habilitar PHP dentro de la carpeta frontend
        location ~ \.php$ {
            fastcgi_pass pi_php:9000;
            include fastcgi_params;
            # Importante: usar request_filename para que respete el alias
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # 3. Configuración especial para la carpeta BACKEND
    location /backend/ {
        alias /var/www/html/backend/;
        
        location ~ \.php$ {
            fastcgi_pass pi_php:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # 4. Manejo principal
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. PHP general (para public)
    location ~ \.php$ {
        fastcgi_pass pi_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}